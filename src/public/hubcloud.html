  <style>
    :root {
      --background: #090d16;
      --card: #0f172a;
      --foreground: #f1f5f9;
      --muted-foreground: #94a3b8;
      --border: #1e293b;
      --primary: #2563eb;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>

<body class="bg-transparent text-[var(--foreground)] antialiased p-2">

    <!-- Ultra Compact Top Bar -->
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--border)] pb-2">
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold text-white tracking-wide">HubCloud Links</span>
        <span id="stat-count" class="text-[11px] text-[var(--muted-foreground)]">(45 items)</span>
      </div>

      <!-- Quick Category Filter Pills -->
      <div class="flex flex-wrap items-center gap-1">
        <button onclick="setFilter('ALL')" class="pill-btn active px-2 py-0.5 rounded text-[11px] font-semibold bg-blue-600 text-white transition">All (45)</button>
        <button onclick="setFilter('ZIP')" class="pill-btn px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Zip Packs (5)</button>

        <button onclick="copyAllVisible()" class="ml-1 px-2.5 py-0.5 rounded text-[11px] font-semibold bg-emerald-600 text-white hover:bg-emerald-500 transition shadow">Copy All</button>
      </div>
    </div>

      <!-- Dynamic Content -->
    </div>

    let currentGroupFilter = 'ALL';

    function setFilter(grp) {
      currentGroupFilter = grp;
      document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });
      event.target.classList.remove('bg-slate-800', 'text-slate-300');
      event.target.classList.add('bg-blue-600', 'text-white');
      render();
    }

    function render() {
      const container = document.getElementById('list-container');
      const filtered = currentGroupFilter === 'ALL' ? data : data.filter(d => d.group === currentGroupFilter);
      document.getElementById('stat-count').textContent = `(${filtered.length} items)`;

      // Group items
      const groups = {};
      filtered.forEach(item => {
        if (!groups[item.groupName]) groups[item.groupName] = [];
        groups[item.groupName].push(item);
      });

      container.innerHTML = Object.entries(groups).map(([grpName, items]) => {
        const itemRows = items.map(item => `
          <div class="bg-slate-900/90 border border-slate-800 rounded p-2 text-xs font-mono space-y-1 hover:border-slate-700 transition">
            <!-- Line 1: Title -->
            <div class="flex items-center justify-between gap-2">
              <span class="text-slate-200 select-all truncate">${escapeHtml(item.filename)}</span>
              <button onclick="copyText('${escapeAttr(item.filename)}', 'Copied Title!')" class="px-2 py-0.5 rounded text-[11px] font-sans font-medium bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 active:scale-95 transition flex-shrink-0">
                Copy
              </button>
            </div>
            <!-- Line 2: Link -->
            <div class="flex items-center justify-between gap-2 border-t border-slate-800/80 pt-1">
              <a href="${item.hubcloudUrl}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:underline truncate select-all">
                ${item.hubcloudUrl}
              </a>
              <button onclick="copyText('${item.hubcloudUrl}', 'Copied Link!')" class="px-2 py-0.5 rounded text-[11px] font-sans font-medium bg-blue-950 border border-blue-800 text-blue-300 hover:text-white hover:bg-blue-900 active:scale-95 transition flex-shrink-0">
                Copy
              </button>
            </div>
          </div>
        `).join('');

        return `
          <div class="space-y-1.5">
            <div class="flex items-center justify-between px-1">
              <span class="text-xs font-bold text-slate-400">${grpName}</span>
              <button onclick="copyGroup('${escapeAttr(grpName)}')" class="text-[11px] text-blue-400 hover:underline">Copy Group</button>
            </div>
            ${itemRows}
          </div>
        `;
      }).join('');
    }

    function copyText(txt, msg = 'Copied!') {
      navigator.clipboard.writeText(txt).then(() => showToast(msg)).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(msg);
      });
    }

    function copyGroup(grpName) {
      const items = data.filter(d => d.groupName === grpName);
      const text = items.map(d => `${d.filename}\n${d.hubcloudUrl}`).join('\n\n');
      copyText(text, `Copied ${items.length} items from ${grpName}!`);
    }

    function copyAllVisible() {
      const filtered = currentGroupFilter === 'ALL' ? data : data.filter(d => d.group === currentGroupFilter);
      const text = filtered.map(d => `${d.filename}\n${d.hubcloudUrl}`).join('\n\n');
      copyText(text, `Copied ${filtered.length} items!`);
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
      }, 1500);
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeAttr(s) {
      return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    render();
